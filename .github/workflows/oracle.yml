name: Oracle 自动预测更新
on:
  schedule:
    - cron: '20 14 * * *'
  workflow_dispatch:

jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 安装Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装依赖
        run: pip install requests
      - name: 运行Oracle预测
        run: python oracle_core.py --output
      - name: 提交更新
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add oracle_data.js oracle记录/
          git diff --staged --quiet || git commit -m "自动更新 Oracle 预测数据"
          git push
