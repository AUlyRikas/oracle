name: Oracle 自动预测更新

on:
  schedule:
    - cron: '20 14 * * *'
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install requests

      - name: 运行 Oracle 预测
        run: python oracle_core.py --output --auto-update

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add oracle_data.js oracle记录/
          git diff --staged --quiet || git commit -m "自动更新 Oracle 预测数据"
          git push
