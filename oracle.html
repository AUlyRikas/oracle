</head>

<!-- ★ 自动降级加载 JS ★ -->
<script>
(function() {
    var loaded = false;
    var timeout = setTimeout(function() {
        if (!loaded) {
            var fb = document.createElement('script');
            fb.src = 'https://raw.githubusercontent.com/AUlyRikas/oracle/main/oracle_data.js?v=' + Date.now();
            fb.onload = function() { loaded = true; };
            document.head.appendChild(fb);
        }
    }, 3000);
    var pr = document.createElement('script');
    pr.src = 'oracle_data.js?v=' + Date.now();
    pr.onload = function() { loaded = true; clearTimeout(timeout); };
    document.head.appendChild(pr);
})();
</script>

<script>
function checkPwd(){
    var p=document.getElementById('pwd').value;
    if(p==='5121'){
        document.getElementById('lock').style.display='none';
        document.getElementById('app').style.display='block';
        setTimeout(initAll, 500); // 等 JS 加载完成
    }else{
        document.getElementById('lockMsg').innerText='密码错误，请重试';
        document.getElementById('pwd').value='';
    }
}
document.addEventListener('DOMContentLoaded',function(){
    document.getElementById('pwd').addEventListener('keypress',function(e){if(e.key==='Enter')checkPwd();});
});

const redSet=new Set([1,2,7,8,12,13,18,19,23,24,29,30,34,35,40,45,46]);
const blueSet=new Set([3,4,9,10,14,15,20,25,26,31,36,37,41,42,47,48]);
const greenSet=new Set([5,6,11,16,17,21,22,27,28,32,33,38,39,43,44,49]);
function getBallClass(num){let n=parseInt(num);if(redSet.has(n))return'ball-red';if(blueSet.has(n))return'ball-blue';return'ball-green';}

function initAll(){
    if(typeof oracleData !== 'undefined'){
        loadLive();
    }
    loadHistory();
    startCountdown();
}

function loadLive(){
    var p=window.oracleData;
    if(!p||!p.issue){
        document.getElementById('predictResultArea').innerHTML='<div class="predict-card"><div class="predict-title">等待数据加载...</div></div>';
        return;
    }
    document.getElementById('currentExpect').textContent=p.issue;
    document.getElementById('countdownExpect').textContent=p.issue;

    var codes=p.code.split(',').map(function(s){return s.trim();});
    var zodiacs=p.zodiac?p.zodiac.split(',').map(function(z){return z.trim();}):[];
    while(zodiacs.length<codes.length)zodiacs.push('?');
    var html='';
    for(var i=0;i<codes.length;i++){
        html+='<div class="open_code_zone_left-item"><div class="open_code_zone_left-item-number '+getBallClass(codes[i])+'">'+codes[i]+'</div><div class="open_code_zone_left-item-zodiac">'+zodiacs[i]+'</div></div>';
        if(i===5)html+='<div class="open_code_zone_left-item"><div class="open_code_zone_left-item-plus">+</div><div class="open_code_zone_left-item-zodiac">特码</div></div>';
    }
    document.getElementById('liveBallContainer').innerHTML=html;

    document.getElementById('predictResultArea').innerHTML=
        '<div class="predict-card">'+
        '<div class="predict-title">预测下一期: '+p.nextIssue+'</div>'+
        '<div class="predict-subtitle">基于期号: '+p.issue+' | '+p.time+' | 特肖 '+p.teSx+'(尾'+p.teWei+')</div>'+
        '<div class="predict-balls-row">'+p.numbers.slice(0,12).map(function(n){return '<div class="predict-ball '+getBallClass(n)+'">'+n+'</div>';}).join('')+'</div>'+
        '<div class="predict-tags"><span class="predict-tag">大范围生肖: '+p.rangeZodiacs.join('、')+'</span></div>'+
        '<div class="predict-tags"><span class="predict-tag green-tag">重点候选生肖: '+p.sixPool.join('、')+'</span><span class="predict-tag red-tag">杀肖: '+p.killZodiacs.join('、')+'</span></div>'+
        '<div class="predict-tags">'+Object.entries(p.zodiacNumMap).map(function(e){return '<span class="predict-tag">'+e[0]+': '+e[1].join(',')+'</span>';}).join('')+'</div>'+
        (p.top7Tails&&p.top7Tails.length?'<div class="predict-tags"><span class="predict-tag tail-tag">动态尾数: '+p.top7Tails.join('、')+'</span></div>':'')+
        (p.dynamicRate6!==undefined?'<div class="predict-subtitle" style="margin-top:8px;">近50期命中率: 九肖 '+p.dynamicRate9+'% | 六肖 '+p.dynamicRate6+'%</div>':'')+
        '</div>';
}

var fullHistoryList=[],currentPage=1,totalPages=0,PAGE_SIZE=10,HISTORY_API="https://history.macaumarksix.com/history/macaujc2/y/2026";
function buildHistoryBalls(oc,zs){
    if(!oc)return'<span style="color:#999;">无数据</span>';
    var codes=oc.split(',').map(function(s){return s.trim();});
    var zodiacs=zs?zs.split(',').map(function(z){return z.trim();}):[];
    while(zodiacs.length<codes.length)zodiacs.push('?');
    var items='';
    for(var i=0;i<codes.length;i++){
        items+='<span style="display:inline-flex;flex-direction:column;align-items:center;gap:1px;margin:0 1px;"><span class="history-ball '+getBallClass(codes[i])+'">'+codes[i]+'</span><span class="history-zodiac-tag">'+zodiacs[i]+'</span></span>';
        if(i===5)items+='<span class="history-plus">+</span>';
    }
    return items;
}
function renderHistory(){
    if(!fullHistoryList.length){document.getElementById('historyContent').innerHTML='<div class="loading-box">暂无历史数据</div>';document.getElementById('paginationContainer').style.display='none';return;}
    totalPages=Math.ceil(fullHistoryList.length/PAGE_SIZE);if(currentPage>totalPages)currentPage=totalPages;if(currentPage<1)currentPage=1;
    var start=(currentPage-1)*PAGE_SIZE,end=Math.min(start+PAGE_SIZE,fullHistoryList.length),display=fullHistoryList.slice(start,end),rows='';
    for(var i=0;i<display.length;i++){var item=display[i];rows+='<div class="history-row"><div class="hisIssue-cell">'+(item.expect||'-')+'</div><div class="hisTime-cell">'+(item.openTime?item.openTime.split(' ')[0]:'-')+'</div><div class="hisCode-cell">'+buildHistoryBalls(item.openCode,item.zodiac)+'</div><div class="hisPlay-cell">查看</div></div>';}
    document.getElementById('historyContent').innerHTML=rows;renderPagination();
}
function renderPagination(){
    var container=document.getElementById('paginationContainer');if(totalPages<=1){container.style.display='none';return;}
    container.style.display='flex';var html='<button class="nav-btn" id="pagePrev"'+(currentPage===1?' disabled style="opacity:0.5;cursor:not-allowed;"':'')+'>◀</button>',maxButtons=7,sp,ep;
    if(totalPages<=maxButtons){sp=1;ep=totalPages;}else{var side=Math.floor(maxButtons/2);if(currentPage<=side+1){sp=1;ep=maxButtons;}else if(currentPage>=totalPages-side){sp=totalPages-maxButtons+1;ep=totalPages;}else{sp=currentPage-side;ep=currentPage+side;}}
    if(sp>1){html+='<button class="nav-btn page-btn" data-page="1">1</button>';if(sp>2)html+='<span class="page-ellipsis">...</span>';}
    for(var i=sp;i<=ep;i++)html+='<button class="nav-btn page-btn'+(i===currentPage?' active-page':'')+'" data-page="'+i+'">'+i+'</button>';
    if(ep<totalPages){if(ep<totalPages-1)html+='<span class="page-ellipsis">...</span>';html+='<button class="nav-btn page-btn" data-page="'+totalPages+'">'+totalPages+'</button>';}
    html+='<button class="nav-btn" id="pageNext"'+(currentPage===totalPages?' disabled style="opacity:0.5;cursor:not-allowed;"':'')+'>▶</button>';container.innerHTML=html;
    container.querySelectorAll('.page-btn').forEach(function(btn){btn.addEventListener('click',function(){var page=parseInt(this.dataset.page);if(page!==currentPage){currentPage=page;renderHistory();}});});
    var pb=document.getElementById('pagePrev'),nb=document.getElementById('pageNext');if(pb)pb.addEventListener('click',function(){if(currentPage>1){currentPage--;renderHistory();}});if(nb)nb.addEventListener('click',function(){if(currentPage<totalPages){currentPage++;renderHistory();}});
}
function searchByExpect(num){
    if(!num||!fullHistoryList.length)return;var idx=fullHistoryList.findIndex(function(item){return item.expect===num;});
    if(idx!==-1){currentPage=Math.floor(idx/PAGE_SIZE)+1;renderHistory();setTimeout(function(){var rows=document.getElementById('historyContent').querySelectorAll('.history-row'),lidx=idx%PAGE_SIZE;if(rows[lidx]){rows[lidx].scrollIntoView({behavior:'smooth',block:'center'});rows[lidx].style.background='#fff3cd';setTimeout(function(){rows[lidx].style.background='';},2000);}},100);}else{alert('未找到该期号');}
}
async function loadHistory(){
    document.getElementById('historyContent').innerHTML='<div class="loading-box">加载历史中...</div>';
    try{var resp=await fetch(HISTORY_API);if(!resp.ok)throw new Error('API不可用');var json=await resp.json();processHistoryData(json);}
    catch(e){console.log('API失败，加载本地缓存...');fetch('2026.json').then(function(r){return r.json();}).then(processHistoryData).catch(function(){document.getElementById('historyContent').innerHTML='<div class="loading-box">历史数据暂不可用</div>';});}
}
function processHistoryData(json){
    var arr=json?.data||(Array.isArray(json)?json:null);
    if(arr&&arr.length){var map=new Map();for(var i=0;i<arr.length;i++){if(!map.has(arr[i].expect))map.set(arr[i].expect,arr[i]);}fullHistoryList=Array.from(map.values()).sort(function(a,b){return parseInt(b.expect)-parseInt(a.expect);});currentPage=1;renderHistory();}
    else{document.getElementById('historyContent').innerHTML='<div class="loading-box">暂无历史数据</div>';}
}

function refreshAI(){
    // 清理所有加载过 oracle_data.js 的 script 标签
    var oldScripts = document.querySelectorAll('script[src*="oracle_data.js"]');
    oldScripts.forEach(function(s) { s.remove(); });
    delete window.oracleData;
    document.getElementById('predictResultArea').innerHTML='<div class="predict-card"><div class="predict-title">刷新预测中...</div></div>';
    // 重新触发自动降级加载
    var loaded = false;
    var timeout = setTimeout(function() {
        if (!loaded) {
            var fb = document.createElement('script');
            fb.src = 'https://raw.githubusercontent.com/AUlyRikas/oracle/main/oracle_data.js?v=' + Date.now();
            fb.onload = function() { loaded = true; if(typeof oracleData !== 'undefined'){loadLive();} };
            document.head.appendChild(fb);
        }
    }, 3000);
    var pr = document.createElement('script');
    pr.src = 'oracle_data.js?v=' + Date.now();
    pr.onload = function() { loaded = true; clearTimeout(timeout); if(typeof oracleData !== 'undefined'){loadLive();} };
    pr.onerror = function(){document.getElementById('predictResultArea').innerHTML='<div class="predict-card"><div class="predict-title">预测数据加载失败</div></div>';};
    document.head.appendChild(pr);
}

document.addEventListener('DOMContentLoaded',function(){
    document.getElementById('navHome').addEventListener('click',function(e){e.preventDefault();location.reload();});
    document.getElementById('navAiPredict').addEventListener('click',function(e){e.preventDefault();refreshAI();});
    document.getElementById('navLive').addEventListener('click',function(e){e.preventDefault();document.getElementById('liveBallContainer').scrollIntoView({behavior:'smooth'});});
    document.getElementById('navHistory').addEventListener('click',function(e){e.preventDefault();document.getElementById('historyContent').scrollIntoView({behavior:'smooth'});});
    document.getElementById('navPredict').addEventListener('click',function(e){e.preventDefault();document.getElementById('predictResultArea').scrollIntoView({behavior:'smooth'});});
    document.getElementById('searchExpectBtn').addEventListener('click',function(){var v=document.getElementById('searchExpect').value.trim();if(v)searchByExpect(v);});
    document.getElementById('searchExpect').addEventListener('keypress',function(e){if(e.key==='Enter'){var v=e.target.value.trim();if(v)searchByExpect(v);}});
});

var countdownTarget=null,countdownTimer=null;
function calculateNextDrawTime(){var now=new Date();countdownTarget=new Date(now);countdownTarget.setHours(21,30,0,0);if(now.getHours()>21||(now.getHours()===21&&now.getMinutes()>=30))countdownTarget.setDate(countdownTarget.getDate()+1);}
function updateCountdownDisplay(){var now=new Date();if(!countdownTarget||countdownTarget<=now)calculateNextDrawTime();var diff=countdownTarget-now;if(diff<=0){calculateNextDrawTime();diff=countdownTarget-now;}var ts=Math.floor(diff/1000),h=Math.floor(ts/3600),m=Math.floor((ts%3600)/60),s=ts%60,str=String(h).padStart(2,'0')+String(m).padStart(2,'0')+String(s).padStart(2,'0'),items=document.getElementById('countdownTimer').querySelectorAll('.countdown-item');for(var i=0;i<items.length&&i<str.length;i++)items[i].textContent=str[i];}
function startCountdown(){calculateNextDrawTime();updateCountdownDisplay();if(countdownTimer)clearInterval(countdownTimer);countdownTimer=setInterval(updateCountdownDisplay,1000);}
window.addEventListener('scroll',function(){var btn=document.getElementById('backToTop');if(window.scrollY>300)btn.classList.add('show');else btn.classList.remove('show');});
</script>
